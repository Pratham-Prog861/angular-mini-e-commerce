<aside class="cart-summary">
  <div class="summary-header">
    <h2 class="summary-title">Order Summary</h2>
  </div>

  <div class="summary-body">
    <div class="summary-row">
      <span class="row-label">Items</span>
      <span class="row-value">{{ itemCount() }}</span>
    </div>
    <div class="summary-row">
      <span class="row-label">Subtotal</span>
      <span class="row-value">{{ subtotalCents() | currencyFormat }}</span>
    </div>
    
    <div class="summary-divider"></div>
    
    <div class="summary-row total">
      <span class="row-label">Total</span>
      <span class="row-value">{{ totalCents() | currencyFormat }}</span>
    </div>
  </div>

  <div class="summary-footer">
    <a
      routerLink="/checkout"
      class="checkout-btn"
      [class.disabled]="!hasItems()"
      [attr.aria-disabled]="!hasItems()"
    >
      <span>Proceed to Checkout</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M5 12h14M12 5l7 7-7 7"/>
      </svg>
    </a>
    <p class="summary-note">Demo checkout — no payment required</p>
  </div>
</aside>
