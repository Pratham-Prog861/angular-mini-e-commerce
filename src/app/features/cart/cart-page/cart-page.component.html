<div class="cart-page">
  <div class="cart-header">
    <div class="header-content">
      <h1 class="page-title">Your Cart</h1>
      <p class="page-subtitle">{{ items().length }} item{{ items().length !== 1 ? 's' : '' }}</p>
    </div>
    <a routerLink="/products" class="continue-link">
      <span>Continue Shopping</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M5 12h14M12 5l7 7-7 7"/>
      </svg>
    </a>
  </div>

  @if (!hasItems()) {
    <div class="empty-cart-wrapper">
      <div class="empty-cart">
        <div class="empty-icon">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
            <line x1="3" y1="6" x2="21" y2="6"/>
            <path d="M16 10a4 4 0 0 1-8 0"/>
          </svg>
        </div>
        <h2 class="empty-title">Your cart is empty</h2>
        <p class="empty-description">Looks like you haven't added any items yet.</p>
        <a routerLink="/products" class="browse-btn">
          Browse Products
        </a>
      </div>
    </div>
  } @else {
    <div class="cart-layout">
      <section class="cart-items">
        @for (item of items(); track item.productId; let i = $index) {
          <div class="cart-item" [style.animation-delay]="(i * 80) + 'ms'">
            <app-cart-item [item]="item" />
          </div>
        }
      </section>
      <app-cart-summary />
    </div>
  }
</div>
