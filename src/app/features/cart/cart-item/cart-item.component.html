<div class="cart-item-card">
  <a
    class="item-image-link"
    [routerLink]="['/products', item().productId]"
  >
    <img
      class="item-image"
      [src]="item().product.imageUrl"
      [alt]="item().product.title"
    />
  </a>

  <div class="item-details">
    <div class="item-header">
      <div class="item-info">
        <a
          class="item-title"
          [routerLink]="['/products', item().productId]"
        >{{ item().product.title }}</a>
        <p class="item-category">{{ item().product.category }}</p>
      </div>
      <button
        type="button"
        class="remove-btn"
        (click)="remove()"
        aria-label="Remove item"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
        </svg>
      </button>
    </div>

    <div class="item-footer">
      <div class="quantity-controls">
        <button
          type="button"
          class="qty-btn"
          (click)="decrement()"
          aria-label="Decrease quantity"
        >
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M5 12h14"/>
          </svg>
        </button>
        <input
          #qtyInput
          class="qty-input"
          inputmode="numeric"
          [value]="item().quantity"
          (input)="setQuantity(qtyInput.value)"
          aria-label="Quantity"
        />
        <button
          type="button"
          class="qty-btn"
          (click)="increment()"
          aria-label="Increase quantity"
        >
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 5v14M5 12h14"/>
          </svg>
        </button>
      </div>

      <div class="item-pricing">
        <p class="unit-price">{{ item().product.priceCents | currencyFormat }} each</p>
        <p class="line-total">{{ lineTotalCents() | currencyFormat }}</p>
      </div>
    </div>
  </div>
</div>
